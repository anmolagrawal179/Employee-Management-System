<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee Management System</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
	<nav class="navbar navbar-expand-sm bg-primary navbar-dark">
		<div class="container-fluid">
			<ul class="navbar-nav">
				<a class="navbar-brand" th:href="@{/}">Employee Management
					System</a>
				<li class="nav-item"><a class="nav-link"
					th:href="@{/employee-list}">Employee List</a></li>
				<li class="nav-item"><a class="nav-link"
					th:href="@{/add-employee}">Add Employee</a></li>

			</ul>
		</div>
	</nav>
	<br />
	<div class="container">
		<h3 class="text-center">Employee List</h3>
		<br />
		<table class="table table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th>Employee Id</th>
					<th>Employee Name</th>
					<th>Employee Email</th>
					<th>Employee Designation</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="employee:${employees}">
					<td th:text="${employee.id}"></td>
					<td th:text="${employee.name}"></td>
					<td th:text="${employee.email}"></td>
					<td th:text="${employee.designation}"></td>
					<td><a th:href="@{/update-employee/{id}(id=${employee.id})}"
						class="btn btn-info">Update</a> <a
						th:href="@{/delete-employee/{id}(id=${employee.id})}"
						class="btn btn-danger" style="margin-left: 10px">Delete</a></td>
				</tr>
			</tbody>
		</table>
	</div>
	<nav
		class="navbar navbar-expand-sm bg-primary navbar-dark fixed-bottom">

	</nav>
</body>
</html>
