<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee Management System</title>
<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>

	<nav class="navbar navbar-expand-sm bg-primary navbar-dark">
		<div class="container-fluid">
			<ul class="navbar-nav">
				<a class="navbar-brand" th:href="@{/}">Employee Management
					System</a>
				<li class="nav-item"><a class="nav-link"
					th:href="@{/employee-list}">Employee List</a></li>
				<li class="nav-item"><a class="nav-link"
					th:href="@{/add-employee}">Add Employee</a></li>

			</ul>
		</div>
	</nav>
	<br />
	<div class="container">
		<h3 class="text-center">Update Employee</h3>
		<br />
		<form th:action="@{/update-employee/{id}(id=${employee.id})}"
			th:object="${employee}" method="post">
			<div>
				<label for="name" class="form-label">Employee Name:</label> <input
					type="text" class="form-control" id="name"
					placeholder="Enter employee name" name="name" th:field="*{name}">
			</div>
			<br />
			<div>
				<label for="email" class="form-label">Employee Email:</label> <input
					type="email" class="form-control" id="email"
					placeholder="Enter employee email" name="email" th:field="*{email}">
			</div>
			<br />
			<div>
				<label for="designation" class="form-label">Employee
					Designation:</label> <input type="text" class="form-control"
					id="designation" placeholder="Enter employee designation"
					name="designation" th:field="*{designation}">
			</div>
			<br />
			<button type="submit" class="btn btn-success">Submit</button>
		</form>
	</div>

	<nav
		class="navbar navbar-expand-sm bg-primary navbar-dark fixed-bottom">

	</nav>

</body>
</html>
